name: MLB Stats Scraper
on:
  schedule:
    # 09:00 UTC = 05:00 ET (zomertijd) / 04:00 ET (wintertijd), zelfde moment
    # als de schedule-scraper: de vorige speeldag is dan helemaal verwerkt.
    - cron: '0 9 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Python instellen
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Statistieken scrapen
        run: python mlb_stats_scraper.py
      - name: JSON bestand committen
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add mlb_stats.json
          git diff --staged --quiet || git commit -m "MLB stats bijgewerkt: $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
